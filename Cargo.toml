[package]
name = "astock"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
comfy-table = "7"

# Async + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encoding (GBK -> UTF-8 for Tencent/Sina APIs)
encoding_rs = "0.8"

# Precision (avoid f64 for money)
rust_decimal = "1"
rust_decimal_macros = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Technical analysis
ta = "0.5"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Desktop notifications
notify-rust = "4"

# HTTP server (for Chrome extension receiver)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Ctrl+C handling
ctrlc = "3"
