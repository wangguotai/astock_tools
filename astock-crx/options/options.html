<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>astock Bridge 设置</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 { color: #1a73e8; }
    .field { margin: 12px 0; }
    .field label { display: block; margin-bottom: 4px; font-weight: 500; }
    .field input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .field .help { font-size: 12px; color: #888; margin-top: 4px; }
    button { padding: 8px 20px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1557b0; }
    #saved { color: #4CAF50; display: none; margin-left: 12px; }
  </style>
</head>
<body>
  <h1>astock Bridge 设置</h1>

  <div class="field">
    <label>astock 接收端地址</label>
    <input id="server-url" type="text" placeholder="http://127.0.0.1:17320" />
    <div class="help">确保 astock receiver 已启动: <code>astock receiver --port 17320</code></div>
  </div>

  <button id="save-btn">保存</button>
  <span id="saved">已保存</span>

  <script src="options.js"></script>
</body>
</html>
