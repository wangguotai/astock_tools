<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>astock Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>astock Bridge</h1>

    <div id="connection" class="section">
      <div class="status-row">
        <span id="status-dot" class="status-dot disconnected"></span>
        <span id="status-text">未连接</span>
      </div>
    </div>

    <div id="current-stock" class="section">
      <h3>当前页面</h3>
      <div id="stock-info">未检测到股票页面</div>
    </div>

    <div class="section">
      <h3>推送记录</h3>
      <div id="push-log" class="log-list">暂无记录</div>
    </div>

    <div class="section">
      <h3>设置</h3>
      <div class="setting-row">
        <label>服务器地址</label>
        <input id="server-url" type="text" value="http://127.0.0.1:17320" />
      </div>
      <button id="save-btn" class="btn">保存</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
